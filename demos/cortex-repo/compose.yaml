services:
  demo:
    build:
      context: .
    init: true
    environment:
      DEMO_SERVE_NAMESPACE: repo-reviewed
      DEMO_LEARN_NAMESPACE: repo-candidates
      DEMO_PROCESSING_PROFILE: repo-demo
      DEMO_GUIDELINES_MODE: standard
      DEMO_PLACEMENT: ${DEMO_PLACEMENT:-user}
    volumes:
      - ./.env:/run/secrets/demo.env:ro
      - ${DEMO_RESULTS_DIR:-./results}:/results
    healthcheck:
      test: ["CMD", "uv", "run", "--offline", "--no-sync", "python", "services.py", "health"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    stop_grace_period: 15s
